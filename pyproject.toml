[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-backtester"
version = "1.0.0"
description = "A trading strategy backtesting framework"
requires-python = ">=3.8"
dependencies = [
    "backtrader>=1.9.76",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
    "scikit-learn>=0.24.0",
    "optuna>=2.10.0",
    "joblib>=1.0.0",
    "yfinance>=0.1.70",
    "statsmodels>=0.12.0",
    "tabulate>=0.8.9",
    "plotly>=5.14.0",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
frontend = [
    "flask>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring full workflow execution",
]
